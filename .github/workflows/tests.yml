name: Golang test suite

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test golang application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run test suite
        run: go test -v ./...
